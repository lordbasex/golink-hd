name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Library
        run: make && make static
      - name: Tests
        run: make test
      - name: Headless run
        run: |
          make tools
          lib=$(ls libgolinkhd.so libgolinkhd.dylib 2>/dev/null || true)
          # every platform must draw and sound exactly the same
          tools/hdrun ./$lib --frames 460 --script tools/runs/walk.txt > walk.out
          diff tools/runs/walk.expected walk.out
          tools/hdrun ./$lib --demo showcase --language es --frames 960 --script tools/runs/showcase.txt > showcase.out
          diff tools/runs/showcase.expected showcase.out
      - name: Frame time
        # every scene within a generous limit (shared runners are slower and noisier than a host)
        run: make bench && tools/bench --limit 12
      - name: Packages
        run: |
          # the demo exported, packed and played as a package
          tools/glhd export-demo demo && tools/glhd pack demo demo.glhd && tools/glhd check demo.glhd
          lib=$(ls libgolinkhd.so libgolinkhd.dylib 2>/dev/null || true)
          tools/hdrun ./$lib --content demo.glhd --frames 460 --script tools/runs/walk.txt

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc
      - name: Library
        run: make platform=win CC=gcc
