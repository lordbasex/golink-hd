name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Core
        run: make
      - name: Tests
        run: make test
      - name: Headless run
        run: |
          make tools
          core=$(ls golink_hd_libretro.*)
          # every platform must draw and sound exactly the same
          tools/hdrun ./$core --frames 460 --script tools/runs/walk.txt > walk.out
          diff tools/runs/walk.expected walk.out
      - name: Packages
        run: |
          # the demo exported, packed and played as a package
          tools/glhd export-demo demo && tools/glhd pack demo demo.glhd && tools/glhd check demo.glhd
          core=$(ls golink_hd_libretro.*)
          tools/hdrun ./$core --content demo.glhd --frames 460 --script tools/runs/walk.txt

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make mingw-w64-x86_64-gcc
      - name: Core
        run: make platform=win CC=gcc
